# Prépare une version publiable de SGM, en BROUILLON : seul Fabian la publie (bouton « Publish release »).
# Lancement : onglet Actions › « Préparer une release (brouillon) » › Run workflow.
# Contenu : SGM_vX.Y.zip (version portable), SGM_Setup_vX.Y.exe (installeur) et SHA256SUMS.txt (empreintes
# des deux, un seul fichier d'empreintes : les v0.9.x le lisent aussi), notes tirées du README.
# La mise à jour automatique de SGM n'installe que des releases publiées, avec ce fichier d'empreintes.
name: Préparer une release (brouillon)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyside6 pyinstaller
      - name: Version
        id: v
        shell: pwsh
        run: |
          $ver = (Select-String -Path statics_manager.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "ver=$ver" >> $env:GITHUB_OUTPUT
      - name: Compilation (dossier, conforme LGPL)
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --icon assets/SGM.ico --name SGM statics_manager.py
      - name: Paquet, empreinte et notes
        shell: pwsh
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          Copy-Item -Recurse licenses dist/SGM/licenses
          Copy-Item README.md, README_FR.md dist/SGM/
          $zip = "SGM_v$ver.zip"
          Compress-Archive -Path dist/SGM -DestinationPath $zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$ver" "/DSourceDir=..\dist\SGM" installer\SGM.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist/SGM_Setup_v$ver.exe" .
          $setup = "SGM_Setup_v$ver.exe"
          $lines = foreach ($f in @($zip, $setup)) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f" }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          # notes : section « **vX.Y** » de l'historique du README
          $lines = Get-Content README.md -Encoding utf8
          $start = [array]::IndexOf($lines, "**v$ver**")
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -ne ""; $i++) { $notes += $lines[$i] }
          }
          ($notes -join "`n") | Out-File -Encoding utf8 notes.md
      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          gh release create "v$ver" "SGM_v$ver.zip" "SGM_Setup_v$ver.exe" SHA256SUMS.txt `
            --draft --title "SGM v$ver" --notes-file notes.md --target "${{ github.sha }}"
