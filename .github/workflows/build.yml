name: Tests et SGM.exe

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 p7zip-full
      - run: pip install pyside6
      - run: bash tests/run_tests.sh

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyside6 pyinstaller
      - name: Compilation (dossier, conforme LGPL)
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --icon assets/SGM.ico --name SGM statics_manager.py
      - name: Licences et README
        shell: pwsh
        run: |
          Copy-Item -Recurse licenses dist/SGM/licenses
          Copy-Item README.md, README_FR.md dist/SGM/
      - name: Installeur (Inno Setup, pour l'utilisateur seul)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (Select-String -Path statics_manager.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" "/DSourceDir=..\dist\SGM" installer\SGM.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: SGM-exe
          path: dist/SGM
          retention-days: 14
      - id: upload_setup
        uses: actions/upload-artifact@v4
        with:
          name: SGM-Setup
          path: dist/SGM_Setup_v*.exe
          retention-days: 14
      - name: Lien dans la PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
          SETUP: ${{ steps.upload_setup.outputs.artifact-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**SGM.exe à tester** : ${process.env.URL}\n\nDécompresse le dossier, lance \`SGM.exe\`.\n\n**Installeur à tester** : ${process.env.SETUP}\n\nDécompresse, lance \`SGM_Setup_v….exe\`. (Commit ${context.sha.slice(0,7)})`
            });
